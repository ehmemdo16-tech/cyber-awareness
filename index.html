
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار التوعية الأمنية</title>
<style>
* { box-sizing: border-box; }
body {
  background:#101827;color:white;font-family:Arial,sans-serif;
  text-align:center;padding:30px 15px;margin:0;
}
.card {
  background:#1e293b;padding:28px 20px;border-radius:20px;
  max-width:450px;margin:45px auto;
}
h1 {font-size:25px}
p {font-size:18px;line-height:1.8}
input {
  width:100%;padding:15px;margin:15px 0;border-radius:10px;
  border:1px solid #64748b;background:#0f172a;color:white;
  font-size:16px;text-align:center;
}
button {
  background:#2563eb;color:white;border:0;padding:14px;
  border-radius:10px;font-size:17px;margin:8px 0;
  cursor:pointer;width:100%;
}
.option {background:#334155;line-height:1.7}
.download {background:#15803d}
.warning {color:#fbbf24;font-size:14px}
.hidden {display:none}
</style>
</head>
<body>
<div class="card">
<h1>🚨 اختبار التوعية الأمنية</h1>

<div id="welcome">
<p>هل تعرف كيف تكتشف الروابط المشبوهة وتحمي حساباتك؟</p>
<input type="text" id="username"
placeholder="أدخل اسماً مستعاراً" maxlength="30"
autocomplete="off">
<p class="warning">استخدم اسماً مستعاراً ولا تدخل بيانات شخصية.</p>
<button onclick="startQuiz()">ابدأ التجربة</button>
</div>

<div id="quiz" class="hidden">
<p id="greeting"></p>
<h3 id="question"></h3>
<div id="answers"></div>
<p id="progress"></p>
</div>

<div id="final" class="hidden">
<h2>🎉 انتهى الاختبار!</h2>
<p id="finalName"></p>
<p id="result"></p>
<button class="download" onclick="downloadResult()">⬇️ تحميل نتيجتي</button>
<button onclick="resetQuiz()">إعادة الاختبار</button>
</div>

<p class="warning">تجربة تعليمية آمنة للتوعية بالأمن السيبراني.</p>
</div>

<script>
const questions = [
{
q:"وصلك رابط من شخص مجهول يطلب بياناتك، ماذا تفعل؟",
a:["أفتح الرابط فوراً","لا أفتحه وأتحقق من مصدره","أرسل بياناتي"],
correct:1
},
{
q:"كيف تتحقق من أن الموقع موثوق؟",
a:["أتحقق من عنوان الموقع ومصدره","أثق بأي تصميم جميل","أدخل كلمة المرور للتجربة"],
correct:0
},
{
q:"طلب منك شخص كلمة مرور حسابك، ماذا تفعل؟",
a:["أرسلها له","أشاركها مع أصدقائي","لا أشارك كلمة المرور مع أحد"],
correct:2
}
];

let current=0,score=0,username="",finishDate="";

function startQuiz(){
username=document.getElementById("username").value.trim();
if(!username){alert("يرجى إدخال اسم مستعار أولاً");return;}
current=0;score=0;
document.getElementById("welcome").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
document.getElementById("greeting").textContent="مرحباً "+username+"، بالتوفيق! 🌟";
showQuestion();
}

function showQuestion(){
const q=questions[current];
document.getElementById("question").textContent=
"السؤال "+(current+1)+": "+q.q;
document.getElementById("progress").textContent=
"السؤال "+(current+1)+" من "+questions.length;
const area=document.getElementById("answers");
area.innerHTML="";
q.a.forEach((answer,index)=>{
const btn=document.createElement("button");
btn.className="option";
btn.textContent=answer;
btn.onclick=()=>checkAnswer(index);
area.appendChild(btn);
});
}

function checkAnswer(index){
if(index===questions[current].correct)score++;
current++;
if(current<questions.length)showQuestion();
else finishQuiz();
}

function finishQuiz(){
finishDate=new Date().toLocaleString("ar");
document.getElementById("quiz").classList.add("hidden");
document.getElementById("final").classList.remove("hidden");
document.getElementById("finalName").textContent="أحسنت يا "+username+"!";
document.getElementById("result").textContent=
"نتيجتك: "+score+" من "+questions.length;
}

function downloadResult(){
const csv="\uFEFFاسم المستخدم,النتيجة,التاريخ\n"+
'"'+username.replace(/"/g,'""')+'",'+
score+" من "+questions.length+',"'+finishDate+'"';
const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url;link.download="my-quiz-result.csv";
document.body.appendChild(link);link.click();link.remove();
URL.revokeObjectURL(url);
}

function resetQuiz(){
document.getElementById("final").classList.add("hidden");
document.getElementById("welcome").classList.remove("hidden");
document.getElementById("username").value="";
username="";
}
</script>
</body>
</html>
